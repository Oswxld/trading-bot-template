name: Admin Test Kit presentation smoke

on:
  push:
    branches: ['fix/admin-test-kit-step6-integration']
    paths:
      - '.github/workflows/admin-test-presentation-fast.yml'
      - 'src/services/admin-test-demonstration.js'
      - 'src/services/admin-test-kit.js'
      - 'src/stores/run-panel-store.ts'
      - 'src/stores/quick-strategy-store.ts'
      - 'tests/admin-test-kit-quick-strategies.browser.spec.cjs'
      - 'tests/admin-test-kit-bulk-trader.browser.spec.cjs'
      - 'tests/admin-test-kit-normal-blockly.browser.spec.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: presentation-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    name: Local-only paper trading presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies and Chromium
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --no-audit --no-fund --legacy-peer-deps @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Build local test website
        run: npm run build
      - name: Verify presentation Win/Loss and Bulk Trader reports
        run: |
          npx http-server dist -a 127.0.0.1 -p 4173 -s > /tmp/presentation-http.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/admin-test-kit-quick-strategies.browser.spec.cjs tests/admin-test-kit-bulk-trader.browser.spec.cjs tests/admin-test-kit-normal-blockly.browser.spec.cjs --grep 'presentation:' --reporter=line --workers=1 --timeout=90000
        env:
          CI: 'true'
      - name: Save error details on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-presentation-failure
          path: |
            test-results/
            /tmp/presentation-http.log
          if-no-files-found: ignore
          retention-days: 3
