name: Bulk Trader verification

on:
  push:
    branches: [develop, 'clients/kevin-forex-trader/develop']
    paths:
      - 'src/pages/bulk-trader/**'
      - 'src/components/layout/app-logo/**'
      - 'src/components/admin-test-kit/**'
      - 'src/services/admin-test-kit.js'
      - 'src/services/__tests__/admin-test-kit.test.js'
      - 'src/external/bot-skeleton/services/api/appId.js'
      - 'src/components/layout/header/mobile-menu/menu-header.tsx'
      - 'brand.config.json'
      - 'index.html'
      - 'public/yolo-traders-mark.png'
      - 'src/services/trading-request-budget.js'
      - 'src/services/__tests__/trading-request-budget.test.js'
      - 'src/external/bot-skeleton/services/api/appId.js'
      - 'src/external/bot-skeleton/services/api/api-base.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bulk-trader-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Unit tests and production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (repo lockfile currently out of sync)
        # npm ci fails because the existing checked-in lockfile predates recent
        # package.json changes. Resolve once in CI without changing repo files.
        # A separately reviewed lockfile refresh should eventually restore ci.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run all Bulk Trader safety, concurrency and monitoring tests
        run: |
          npx jest \
            src/pages/bulk-trader/__tests__/bulk-account-safety.test.js \
            src/services/__tests__/admin-test-kit.test.js \
            src/pages/bulk-trader/__tests__/bulk-trader-buttons.test.jsx \
            src/pages/bulk-trader/__tests__/bulk-execution.test.js \
            src/pages/bulk-trader/__tests__/bulk-contract-monitor.test.js \
            src/pages/bulk-trader/__tests__/bulk-request-safety.test.js \
            src/pages/bulk-trader/__tests__/bulk-api-request.test.js \
            src/pages/bulk-trader/__tests__/bulk-trader-integration.test.js \
            src/pages/bulk-trader/__tests__/bulk-trade-records.test.js \
            src/pages/bulk-trader/__tests__/bulk-reports-live.test.jsx \
            src/services/__tests__/trading-request-budget.test.js \
            --ci --runInBand --coverage=false

      - name: Build production site
        run: npm run build

      - name: Upload build if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-trader-client-build
          path: dist/
          retention-days: 3
