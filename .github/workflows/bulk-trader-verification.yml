name: Bulk Trader verification

on:
  push:
    branches: [develop, 'clients/kevin-forex-trader/develop', 'fix/admin-test-kit-step2-session-state', 'fix/admin-test-kit-step3-market-feed', 'fix/admin-test-kit-step4-contract-lifecycle', 'fix/admin-test-kit-step5-reporting-ledger', 'fix/admin-test-kit-step6-integration']
    paths:
      - 'src/pages/bulk-trader/**'
      - 'src/components/layout/app-logo/**'
      - 'src/components/admin-test-kit/**'
      - 'src/components/layout/footer/**'
      - 'src/components/layout/header/header.tsx'
      - 'src/services/admin-test-kit.js'
      - 'src/services/admin-test-market-feed.js'
      - 'src/services/__tests__/admin-test-market-feed.test.js'
      - 'src/services/admin-test-demonstration.js'
      - 'src/services/__tests__/admin-test-demonstration.test.js'
      - 'src/services/__tests__/admin-test-contract-lifecycle.test.js'
      - 'src/services/__tests__/admin-test-reporting.test.js'
      - 'src/stores/__tests__/transactions-admin-test.spec.ts'
      - 'src/hooks/useAccountSwitching.ts'
      - 'src/hooks/__tests__/useAccountSwitching-admin-test.spec.tsx'
      - 'src/utils/account-helpers.ts'
      - 'src/services/__tests__/admin-test-kit.test.js'
      - 'src/external/bot-skeleton/services/api/appId.js'
      - 'src/components/layout/header/mobile-menu/menu-header.tsx'
      - 'brand.config.json'
      - 'index.html'
      - 'public/yolo-traders-mark.png'
      - 'src/services/trading-request-budget.js'
      - 'src/services/__tests__/trading-request-budget.test.js'
      - 'src/external/bot-skeleton/services/api/appId.js'
      - 'src/external/bot-skeleton/services/api/api-base.ts'
      - 'src/stores/run-panel-store.ts'
      - 'src/stores/transactions-store.ts'
      - 'src/stores/app-store.ts'
      - 'src/stores/__tests__/app-store-admin-test.spec.ts'
      - 'src/external/bot-skeleton/scratch/dbot.js'
      - 'src/external/bot-skeleton/services/api/chart-api.js'
      - 'src/external/bot-skeleton/services/api/__tests__/chart-api-admin-test.test.js'
      - 'src/stores/client-store.ts'
      - 'src/external/bot-skeleton/services/api/__tests__/**'
      - 'src/external/bot-skeleton/services/api/ticks_service.js'
      - 'src/external/bot-skeleton/services/tradeEngine/trade/__tests__/**'
      - 'src/external/bot-skeleton/services/tradeEngine/utils/__tests__/**'
      - 'src/pages/bot-builder/quick-strategy/__tests__/**'
      - 'src/stores/__tests__/quick-strategy-admin-integration.spec.ts'
      - 'src/stores/__tests__/run-panel-admin-test.spec.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/bulk-trader-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bulk-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Unit tests and production build (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies (repo lockfile currently out of sync)
        # npm ci fails because the existing checked-in lockfile predates recent
        # package.json changes. Resolve once in CI without changing repo files.
        # A separately reviewed lockfile refresh should eventually restore ci.
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run all Bulk Trader safety, concurrency and monitoring tests
        run: |
          npx jest \
            src/pages/bulk-trader/__tests__/bulk-account-safety.test.js \
            src/services/__tests__/admin-test-kit.test.js \
            src/services/__tests__/admin-test-market-feed.test.js \
            src/services/__tests__/admin-test-demonstration.test.js \
            src/services/__tests__/admin-test-contract-lifecycle.test.js \
            src/services/__tests__/admin-test-reporting.test.js \
            src/stores/__tests__/transactions-admin-test.spec.ts \
            src/stores/__tests__/run-panel-admin-test.spec.ts \
            src/stores/__tests__/app-store-admin-test.spec.ts \
            src/external/bot-skeleton/services/api/__tests__/chart-api-admin-test.test.js \
            src/external/bot-skeleton/services/api/__tests__/ticks-simulated-real.test.js \
            src/external/bot-skeleton/services/api/__tests__/api-base-admin-reconnect.test.ts \
            src/external/bot-skeleton/services/tradeEngine/trade/__tests__/simulated-bot-builder-purchase.test.js \
            src/external/bot-skeleton/services/tradeEngine/utils/__tests__/simulated-interpreter-integration.test.js \
            src/pages/bot-builder/quick-strategy/__tests__/admin-test-quick-strategy-presets.spec.ts \
            src/stores/__tests__/quick-strategy-admin-integration.spec.ts \
            src/hooks/__tests__/useAccountSwitching-admin-test.spec.tsx \
            src/components/admin-test-kit/__tests__/admin-test-kit-trigger.test.tsx \
            src/pages/bulk-trader/__tests__/bulk-trader-buttons.test.jsx \
            src/pages/bulk-trader/__tests__/bulk-execution.test.js \
            src/pages/bulk-trader/__tests__/bulk-contract-monitor.test.js \
            src/pages/bulk-trader/__tests__/bulk-request-safety.test.js \
            src/pages/bulk-trader/__tests__/bulk-api-request.test.js \
            src/pages/bulk-trader/__tests__/bulk-trader-integration.test.js \
            src/pages/bulk-trader/__tests__/bulk-trade-records.test.js \
            src/pages/bulk-trader/__tests__/bulk-reports-live.test.jsx \
            src/services/__tests__/trading-request-budget.test.js \
            --ci --runInBand --coverage=false

      - name: Build production site
        run: npm run build

      - name: Upload build if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bulk-trader-client-build
          path: dist/
          retention-days: 3
