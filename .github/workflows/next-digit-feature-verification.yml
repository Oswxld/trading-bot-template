name: Next-digit feature verification

on:
  push:
    branches:
      - feature/next-digit-auto-trader/develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-digit-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check TypeScript
        run: npm run type-check
      - name: Run next-digit tests
        run: npm test -- --ci --runInBand --testPathPattern=next-digit
      - name: Compile production bundle WITHOUT deploying
        run: npm run build
